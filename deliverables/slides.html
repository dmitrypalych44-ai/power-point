<title>Слайды — Стратегия Владивосток 2027</title>
<style>
  :root{--yellow:#FFC100; --ink:#303738; --ink2:#5A6162; --ink3:#8A9091;
        --surface:#F4F5F5; --line:#E1E3E3}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
       font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
         padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .house{width:20px;height:23px;background:var(--yellow);
         clip-path:polygon(0 34%,50% 0,100% 34%,100% 100%,0 100%)}
  header b{font-size:15px}
  header span{font-size:12px;color:var(--ink3)}
  header a{margin-left:auto;font-size:13px;color:var(--ink);text-decoration:none;
           border-bottom:2px solid var(--yellow);padding-bottom:2px}
  main{max-width:1180px;margin:0 auto;padding:26px 20px 70px;
       display:grid;grid-template-columns:1fr 1fr;gap:20px}
  figure{margin:0}
  figure img{width:100%;display:block;border:1px solid var(--line);border-radius:2px}
  figcaption{font-size:12px;color:var(--ink3);padding:7px 2px 0}
  @media (max-width:820px){main{grid-template-columns:1fr}}
</style>
