<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слайды — Стратегия ПРО, Владивосток 2027</title>
<style>
  :root{--yellow:#FFC100; --ink:#303738; --ink2:#5A6162; --ink3:#8A9091;
        --surface:#F4F5F5; --line:#E1E3E3}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
       font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);
         padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .house{width:20px;height:23px;background:var(--yellow);
         clip-path:polygon(0 34%,50% 0,100% 34%,100% 100%,0 100%)}
  header b{font-size:15px}
  header span{font-size:12px;color:var(--ink3)}
  header a{margin-left:auto;font-size:13px;color:var(--ink);text-decoration:none;
           border-bottom:2px solid var(--yellow);padding-bottom:2px}
  main{max-width:1180px;margin:0 auto;padding:26px 20px 70px;
       display:grid;grid-template-columns:1fr 1fr;gap:20px}
  figure{margin:0}
  figure img{width:100%;display:block;border:1px solid var(--line);border-radius:2px}
  figcaption{font-size:12px;color:var(--ink3);padding:7px 2px 0}
  @media (max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="house"></div>
  <b>Стратегия ПРО — Владивосток 2027</b>
  <span>9 слайдов · ПРО, магазин 75</span>

</header>
<main>
  <figure><img src="pro_preview/p01.png" alt="Слайд 01" loading="lazy"><figcaption>01 · Обложка — стратегия ПРО, Владивосток 2027</figcaption></figure>
  <figure><img src="pro_preview/p02.png" alt="Слайд 02" loading="lazy"><figcaption>02 · Рынок: Приморский край и Владивосток</figcaption></figure>
  <figure><img src="pro_preview/p03.png" alt="Слайд 03" loading="lazy"><figcaption>03 · Потенциал рынка ПРО — 30,7 млрд ₽</figcaption></figure>
  <figure><img src="pro_preview/p04.png" alt="Слайд 04" loading="lazy"><figcaption>04 · Конкуренция: дилеры и входящий поток</figcaption></figure>
  <figure><img src="pro_preview/p05.png" alt="Слайд 05" loading="lazy"><figcaption>05 · Наши силы и риски</figcaption></figure>
  <figure><img src="pro_preview/p06.png" alt="Слайд 06" loading="lazy"><figcaption>06 · Амбиция 2027 — 3 млрд ₽ по каналам</figcaption></figure>
  <figure><img src="pro_preview/p07.png" alt="Слайд 07" loading="lazy"><figcaption>07 · Что меняем в 2027 — шесть изменений</figcaption></figure>
  <figure><img src="pro_preview/p08.png" alt="Слайд 08" loading="lazy"><figcaption>08 · Как достигнем цели · МП 1,2</figcaption></figure>
  <figure><img src="pro_preview/p09.png" alt="Слайд 09" loading="lazy"><figcaption>09 · Как достигнем цели · МП 3,5</figcaption></figure>
</main>
</body>
</html>
